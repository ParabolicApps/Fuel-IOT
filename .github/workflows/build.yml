name: Build Android APK
run-name: Build Current Repo APK via Workflow Dispatch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Automatically check out the current repository and branch
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java environment (Using Java 17 as standard default)
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # 3. Securely inject the google-services.json into the app folder
      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_SECRET" ]; then
            echo "❌ ERROR: GOOGLE_SERVICES_JSON secret is missing or empty!"
            exit 1
          fi
          mkdir -p app
          echo "$GOOGLE_SERVICES_SECRET" | base64 --decode > app/google-services.json
          echo "✅ google-services.json safely injected into app/ directory."

      # 4. Build the APK using the repository's native codebase
      - name: Build APK
        run: |
          if [ ! -f "gradlew" ]; then gradle wrapper; fi
          chmod +x gradlew

          # Defaulting task to assembleDebug. Change to assembleRelease if you are ready to test production builds.
          GRADLE_TASK="assembleDebug"

          if [[ "$GRADLE_TASK" == *Release* ]]; then
            echo "Task contains 'Release', attempting to sign a release build with a debug key."

            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              echo "Debug keystore not found. Creating one..."

              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

              mkdir -p $HOME/.android
              mv debug.keystore $HOME/.android/debug.keystore
            fi

            ./gradlew $GRADLE_TASK \
              -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android \
              --stacktrace
          else
            ./gradlew $GRADLE_TASK --stacktrace
          fi

      # 5. Save the generated build
      - name: Upload the APK artifact with 1 day retention
        uses: actions/upload-artifact@v4
        with:
          path: app/build/outputs/apk/**/*.apk
          name: apk-archive
          retention-days: 1
