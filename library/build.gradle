plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace "me.itangqi.waveloadingview"
    compileSdk 34

    defaultConfig {
        minSdk 14
        targetSdk 34
        versionCode 7
        versionName "0.3.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }

    // IMPORTANT for modern AGP
    publishing {
        singleVariant("release")
    }
}